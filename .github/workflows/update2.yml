name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          echo "📥 تعداد خطوط: $(wc -l < all.txt)"

      - name: Detect country codes using Batch API (Super Fast)
        run: |
          # استخراج همه IPهای یکتا
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt | sort -u > unique_ips.txt
          echo "🌐 تعداد IPهای یکتا: $(wc -l < unique_ips.txt)"
          
          # تبدیل IPها به فایل‌های ۱۰۰ تایی
          split -l 100 unique_ips.txt chunk_
          
          # دریافت کشورها با Batch
          > country_map.txt
          for chunk in chunk_*; do
            # ساخت JSON آرایه‌ای از IPها
            json=$(jq -R . < "$chunk" | jq -s .)
            
            # ارسال درخواست Batch
            curl -s -X POST "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              -d "$json" | jq -r '.[] | "\(.query)|\(.countryCode // "XX")"' >> country_map.txt
            
            echo "✅ یک دسته پردازش شد"
            sleep 0.2
          done
          
          # ساخت فایل نهایی با کشورها
          > final.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)
            
            if [ -n "$ip" ]; then
              # پیدا کردن کشور از نقشه
              country_code=$(grep "^$ip|" country_map.txt | cut -d'|' -f2)
              [ -z "$country_code" ] && country_code="XX"
              
              clean_line=$(echo "$line" | sed 's/#.*//')
              echo "${clean_line}#${country_code}" >> final.txt
            else
              echo "${line}#XX" >> final.txt
            fi
          done < all.txt
          
          mv final.txt all.txt
          rm -f chunk_* unique_ips.txt country_map.txt

      - name: Keep 200 random configs
        run: |
          shuf all.txt | head -n 200 > SUBTEXT2
          echo "📄 تعداد نهایی: $(wc -l < SUBTEXT2)"

      - name: Show sample (debug)
        run: head -n 3 SUBTEXT2

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2
          git diff --cached --quiet && exit 0
          git commit -m "Update SUBTEXT2 with countries (Batch)"
          git push
