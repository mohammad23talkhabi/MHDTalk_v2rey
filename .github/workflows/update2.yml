name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          echo "📥 تعداد کل: $(wc -l < all.txt)"

      - name: Pick 400 random configs
        run: |
          shuf all.txt | head -n 400 > random_400.txt
          echo "📄 تعداد رندوم: $(wc -l < random_400.txt)"

      - name: Detect FULL country name (not code)
        run: |
          set +e
          
          # استخراج IP از ۴۰۰ تا
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' random_400.txt | sort -u > unique_ips.txt
          echo "🌐 تعداد IP یکتا: $(wc -l < unique_ips.txt)"
          
          > country_map.txt
          if [ -s unique_ips.txt ]; then
            split -l 100 unique_ips.txt chunk_
            for chunk in chunk_*; do
              json=$(jq -R . < "$chunk" | jq -s . 2>/dev/null || echo '[]')
              response=$(curl -s -X POST "http://ip-api.com/batch" \
                -H "Content-Type: application/json" \
                -d "$json")
              
              # اینجا به جای countryCode از country استفاده میکنیم → اسم کامل
              if echo "$response" | jq -e . >/dev/null 2>&1; then
                echo "$response" | jq -r '.[] | "\(.query)|\(.country // "Unknown")"' >> country_map.txt
              else
                cat "$chunk" | while read ip; do echo "$ip|Unknown"; done >> country_map.txt
              fi
              sleep 0.1
            done
            rm -f chunk_*
          fi
          
          > final.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)
            country="Unknown"
            if [ -n "$ip" ]; then
              country=$(grep "^$ip|" country_map.txt | cut -d'|' -f2 | head -1 || echo "Unknown")
              [ -z "$country" ] && country="Unknown"
            fi
            
            # vmess
            if [[ "$line" == vmess://* ]]; then
              encoded=$(echo "$line" | sed 's/vmess:\/\///')
              decoded=$(echo "$encoded" | base64 -d 2>/dev/null || echo '')
              if [ -n "$decoded" ] && echo "$decoded" | jq -e . >/dev/null 2>&1; then
                new_decoded=$(echo "$decoded" | jq --arg country "$country" '.ps = $country')
                new_encoded=$(echo "$new_decoded" | base64 -w 0 2>/dev/null || echo "$new_decoded" | base64)
                echo "vmess://$new_encoded" >> final.txt
              else
                echo "${line}#${country}" >> final.txt
              fi
            else
              if [[ "$line" == *"#"* ]]; then
                echo "$line" | sed "s/#[^#]*$/#$country/" >> final.txt
              else
                echo "${line}#${country}" >> final.txt
              fi
            fi
          done < random_400.txt
          
          mv final.txt SUBTEXT2
          rm -f unique_ips.txt country_map.txt random_400.txt
          
          echo "✅ فایل نهایی با $(wc -l < SUBTEXT2) کانفیگ"
          echo "📋 نمونه:"
          head -n 3 SUBTEXT2

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2
          if git diff --cached --quiet; then
            echo "✅ بدون تغییر"
            exit 0
          fi
          git commit -m "Update SUBTEXT2 with full country names"
          git push
