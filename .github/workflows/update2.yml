name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download & Pick 200 random (optimized)
        run: |
          curl -sfL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" | shuf -n 200 > SUBTEXT2
          echo "📄 تعداد: $(wc -l < SUBTEXT2)"

      - name: Detect country in one go (ultra fast)
        run: |
          set +e
          
          # استخراج همه IPها با یک grep
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' SUBTEXT2 | sort -u > ips.txt
          
          # ساخت JSON آرایه‌ای برای Batch API
          jq -R . ips.txt | jq -s . > batch.json
          
          # ارسال یک درخواست Batch برای همه IPها
          curl -s -X POST "http://ip-api.com/batch" \
            -H "Content-Type: application/json" \
            -d @batch.json | jq -r '.[] | "\(.query)|\(.country // "Unknown")"' > map.txt
          
          # پردازش سریع با jq (یکباره همه خطوط)
          while IFS= read -r line; do
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)
            country="Unknown"
            [ -n "$ip" ] && country=$(grep "^$ip|" map.txt | cut -d'|' -f2 | head -1 || echo "Unknown")
            
            if [[ "$line" == vmess://* ]]; then
              encoded=$(echo "$line" | sed 's/vmess:\/\///')
              decoded=$(echo "$encoded" | base64 -d 2>/dev/null)
              if [ -n "$decoded" ] && echo "$decoded" | jq -e . >/dev/null 2>&1; then
                new=$(echo "$decoded" | jq --arg c "$country" '.ps = $c')
                new64=$(echo "$new" | base64 -w 0 2>/dev/null || echo "$new" | base64)
                echo "vmess://$new64"
              else
                echo "${line}#${country}"
              fi
            else
              echo "${line}#${country}"
            fi
          done < SUBTEXT2 > temp.txt
          
          mv temp.txt SUBTEXT2
          rm -f ips.txt batch.json map.txt
          
          echo "✅ نمونه:"
          head -n 2 SUBTEXT2

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2
          git diff --cached --quiet && exit 0
          git commit -m "🚀 Ultra fast update"
          git push
