name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          echo "📥 تعداد خطوط: $(wc -l < all.txt)"

      - name: Detect country and inject into config
        run: |
          # استخراج IPهای یکتا
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt | sort -u > unique_ips.txt
          echo "🌐 تعداد IPهای یکتا: $(wc -l < unique_ips.txt)"
          
          split -l 100 unique_ips.txt chunk_
          
          > country_map.txt
          for chunk in chunk_*; do
            json=$(jq -R . < "$chunk" | jq -s .)
            curl -s -X POST "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              -d "$json" | jq -r '.[] | "\(.query)|\(.countryCode // "XX")"' >> country_map.txt
            sleep 0.2
          done
          
          > final.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)
            country_code="XX"
            
            if [ -n "$ip" ]; then
              country_code=$(grep "^$ip|" country_map.txt | cut -d'|' -f2)
              [ -z "$country_code" ] && country_code="XX"
            fi
            
            # ====================================================
            # بخش اصلی: تغییر نام داخل لینک
            # ====================================================
            
            # 1. اگر لینک vmess:// هست
            if [[ "$line" == vmess://* ]]; then
              # استخراج بخش base64
              encoded=$(echo "$line" | sed 's/vmess:\/\///')
              decoded=$(echo "$encoded" | base64 -d 2>/dev/null)
              
              if [ -n "$decoded" ]; then
                # اضافه کردن کشور به فیلد ps
                new_decoded=$(echo "$decoded" | jq --arg country "$country_code" '.ps = $country')
                new_encoded=$(echo "$new_decoded" | base64 -w 0)
                echo "vmess://$new_encoded" >> final.txt
              else
                echo "$line" >> final.txt
              fi
            
            # 2. اگر لینک vless:// هست
            elif [[ "$line" == vless://* ]]; then
              # vless معمولاً به فرمت vless://uuid@ip:port?params#remark
              # ما جای remark رو عوض می‌کنیم
              if [[ "$line" == *"#"* ]]; then
                # اگه قبلاً remark داشت، عوضش کن
                echo "$line" | sed "s/#[^#]*$/#$country_code/" >> final.txt
              else
                # اگه نداشت، اضافه کن
                echo "${line}#${country_code}" >> final.txt
              fi
            
            # 3. سایر فرمت‌ها (مثل trojan، socks و ...)
            else
              # اگه # داشت عوض کن، اگه نداشت اضافه کن
              if [[ "$line" == *"#"* ]]; then
                echo "$line" | sed "s/#[^#]*$/#$country_code/" >> final.txt
              else
                echo "${line}#${country_code}" >> final.txt
              fi
            fi
            
          done < all.txt
          
          mv final.txt all.txt
          rm -f chunk_* unique_ips.txt country_map.txt

      - name: Keep 200 random configs
        run: |
          shuf all.txt | head -n 200 > SUBTEXT2
          echo "📄 تعداد نهایی: $(wc -l < SUBTEXT2)"

      - name: Show sample (debug)
        run: head -n 3 SUBTEXT2

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2
          git diff --cached --quiet && exit 0
          git commit -m "Update SUBTEXT2 with country in ps field"
          git push
