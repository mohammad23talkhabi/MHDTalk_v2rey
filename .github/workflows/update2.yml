name: SUBTEXT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt

      - name: Detect country for each config
        run: |
          > final.txt
          while IFS= read -r line; do
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)
            if [ -n "$ip" ]; then
              country=$(curl -s "http://ip-api.com/json/$ip?fields=country" | jq -r '.country // "Unknown"')
              echo "[$country] $line" >> final.txt
              sleep 0.5
            else
              echo "$line" >> final.txt
            fi
          done < all.txt
          mv final.txt all.txt

      - name: Keep 200 random configs
        run: shuf all.txt | head -n 200 > SUBTEXT2

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2
          git diff --cached --quiet && exit 0
          git commit -m "Update SUBTEXT2 with countries"
          git push
