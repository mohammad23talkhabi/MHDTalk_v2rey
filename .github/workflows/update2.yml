name: SUBTEXT2

on:
  schedule:
    # Asia/Tehran = UTC+03:30 (بدون ساعت تابستانی)
    - cron: "30 20 * * *"   # 00:00 تهران
    - cron: "30 2 * * *"    # 06:00 تهران
    - cron: "30 8 * * *"    # 12:00 تهران
    - cron: "30 14 * * *"   # 18:00 تهران
  workflow_dispatch:

concurrency:
  group: v2ray-subscription
  cancel-in-progress: false

permissions:
  contents: write

env:
  # فهرست کانال‌ها: یک کانال در هر خط. برای افزودن کانال فقط یک خط اضافه کنید.
  CHANNELS: |
    Freenetchannel
    Broz_time
    V2ray_Alpha
    filembad
    vasl_bashim
    MARAMBASHI
    proxycpu
    v2ray_33
    V2rayRoom
    proxy_magazine
    ShadowProxy66
    meliproxyy
    IRAN_V2PING
    configMs
    vpn_spd
    Canfing_VIP
    MR_CONFINGo
    V2Ray_Tz
    isubvpn
    freev2configs
    Coonfigs
    config_star1
    xoox_vpn

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs and rebuild subscription
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          # V2Ray subscription collector: public Telegram channels -> fixed subscription file.
          # Only the Python standard library is used (no pip install needed).
          import base64
          import hashlib
          import html
          import ipaddress
          import json
          import os
          import re
          import socket
          import sys
          import time
          import uuid
          from concurrent.futures import ThreadPoolExecutor
          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Optional
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, quote, unquote, urlsplit
          from urllib.request import Request, urlopen

          try:
              from zoneinfo import ZoneInfo
              TEHRAN = ZoneInfo("Asia/Tehran")
          except Exception:  # pragma: no cover
              TEHRAN = timezone(timedelta(hours=3, minutes=30))

          ROOT = Path(os.getenv("GITHUB_WORKSPACE") or os.getcwd())
          OUT = Path(os.getenv("OUT_DIR", ROOT / "docs"))

          WINDOW_DAYS = int(os.getenv("WINDOW_DAYS", "10"))          # rolling window
          HEAVY_THRESHOLD = int(os.getenv("HEAVY_THRESHOLD", "100"))  # configs per window -> 🤡
          MAX_PER_MESSAGE = 10                                        # more than this -> message ignored
          MAX_PAGES = int(os.getenv("MAX_PAGES", "40"))               # pages (~20 msgs each) per channel
          MAX_TOTAL = int(os.getenv("MAX_TOTAL", "0"))                # 0 = unlimited
          TCP_CHECK = os.getenv("TCP_CHECK", "1") == "1"
          TCP_TIMEOUT = float(os.getenv("TCP_TIMEOUT", "4"))
          SCHEDULE_HOURS = (0, 6, 12, 18)                             # Asia/Tehran
          HEAVY_EMOJI, LIGHT_EMOJI = "🤡", "🤠"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          SCHEMES = ("vless", "vmess", "trojan", "ss")
          SS_METHODS = {
              "aes-128-gcm", "aes-192-gcm", "aes-256-gcm", "chacha20-ietf-poly1305",
              "xchacha20-ietf-poly1305", "chacha20-poly1305", "aes-128-cfb", "aes-192-cfb",
              "aes-256-cfb", "aes-128-ctr", "aes-192-ctr", "aes-256-ctr", "chacha20", "chacha20-ietf",
              "2022-blake3-aes-128-gcm", "2022-blake3-aes-256-gcm", "2022-blake3-chacha20-poly1305",
          }
          BAD_HOSTS = {"localhost", "example.com", "domain.com", "yourdomain.com", "your.domain.com", "host.com"}

          # پیام‌های فروش VPN کاملاً کنار گذاشته می‌شوند (در صورت نیاز کلمات را ویرایش کنید)
          SALE_RE = re.compile(
              r"تومان|فروش|قیمت|تعرفه|سفارش|فروشگاه|خرید\s*(?:اشتراک|سرویس|vpn|وی\s*پی\s*ان)|buy\s*now|\bprice\b",
              re.I,
          )
          # تبلیغات داخل نام سرور حذف می‌شوند
          AD_NAME_RE = re.compile(r"@\w+|t\.me/\S+|https?://\S+|www\.\S+|\S*bot\b|تبلیغ\S*|فروش\S*|خرید\S*", re.I)

          URI_RE = re.compile(r"(?<![A-Za-z0-9+.\-])(?:vless|vmess|trojan|ss)://[^\s<>\"'`]+", re.I)
          TRAIL = ".,;:!?)]}\u00bb\u00ab\u060c\u061b\u200e\u200f\u200c"
          A_RE = re.compile(r'<a\b[^>]*?href="([^"]+)"[^>]*>(.*?)</a>', re.I | re.S)
          MSG_SPLIT = re.compile(r'(?=<div class="tgme_widget_message_wrap)')


          def log(*a):
              print(*a, flush=True)


          # ───────────────────────────── زمان ─────────────────────────────
          def next_slot(now: datetime) -> datetime:
              n = now.astimezone(TEHRAN)
              for h in SCHEDULE_HOURS:
                  c = n.replace(hour=h, minute=0, second=0, microsecond=0)
                  if c > n:
                      return c
              return (n + timedelta(days=1)).replace(hour=SCHEDULE_HOURS[0], minute=0, second=0, microsecond=0)


          # ───────────────────────────── تلگرام ─────────────────────────────
          @dataclass
          class Message:
              channel: str
              id: int
              date: datetime
              text: str


          def http_get(url: str, retries: int = 3) -> str:
              err: Optional[Exception] = None
              for i in range(retries):
                  try:
                      req = Request(url, headers={"User-Agent": UA, "Accept-Language": "en"})
                      with urlopen(req, timeout=25) as r:
                          return r.read().decode("utf-8", "replace")
                  except HTTPError as e:
                      if e.code in (403, 404):
                          raise
                      err = e
                  except Exception as e:
                      err = e
                  time.sleep(2 * (i + 1))
              raise err  # type: ignore[misc]


          def html_to_text(frag: str) -> str:
              def a_sub(m):
                  href = html.unescape(m.group(1))
                  if href.split("://")[0].lower() in SCHEMES:
                      return f" {href} "
                  return m.group(2)

              frag = A_RE.sub(a_sub, frag)
              frag = re.sub(r"<br\s*/?>", "\n", frag, flags=re.I)
              frag = re.sub(r"<[^>]+>", " ", frag)
              return html.unescape(frag)


          def parse_page(page: str):
              msgs = []
              for chunk in MSG_SPLIT.split(page):
                  m = re.search(r'data-post="([^"/]+)/(\d+)"', chunk)
                  d = re.search(r'<time[^>]*datetime="([^"]+)"', chunk)
                  if not (m and d):
                      continue
                  try:
                      dt = datetime.fromisoformat(d.group(1))
                  except ValueError:
                      continue
                  t = re.search(r'class="tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>', chunk, re.S)
                  msgs.append(Message(m.group(1), int(m.group(2)), dt, html_to_text(t.group(1)) if t else ""))
              return msgs


          def fetch_channel(ch: str, cutoff: datetime):
              """Reads t.me/s/<channel> backwards until the cutoff date."""
              found = {}
              before = None
              for page_no in range(MAX_PAGES):
                  url = f"https://t.me/s/{ch}" + (f"?before={before}" if before else "")
                  try:
                      page = http_get(url)
                  except Exception as e:
                      if page_no == 0:
                          raise
                      log(f"  [{ch}] page {page_no} failed ({e}); using what we have")
                      break
                  msgs = parse_page(page)
                  if not msgs:
                      if page_no == 0:
                          raise RuntimeError("no public preview (channel missing or preview disabled)")
                      break
                  fresh = [m for m in msgs if m.id not in found]
                  for m in msgs:
                      found[m.id] = m
                  oldest = min(msgs, key=lambda x: x.id)
                  if oldest.date < cutoff or not fresh:
                      break
                  before = oldest.id
                  time.sleep(0.6)
              return [m for m in found.values() if m.date >= cutoff]


          # ───────────────────────────── کانفیگ‌ها ─────────────────────────────
          @dataclass
          class Config:
              proto: str
              host: str
              port: int
              key: str
              name: str
              uri: str
              vm: Optional[dict] = None


          def b64d(s: str) -> bytes:
              s = s.strip().replace("-", "+").replace("_", "/")
              s += "=" * (-len(s) % 4)
              return base64.b64decode(s)


          def sha(*parts) -> str:
              return hashlib.sha1("|".join(map(str, parts)).encode("utf-8", "replace")).hexdigest()


          def host_ok(h) -> bool:
              if not h:
                  return False
              h = h.strip("[]").lower()
              if h in BAD_HOSTS:
                  return False
              if ":" in h:
                  try:
                      ip = ipaddress.ip_address(h)
                  except ValueError:
                      return False
                  return not (ip.is_loopback or ip.is_unspecified or ip.is_private)
              if not re.fullmatch(r"[a-z0-9._\-]+", h) or "." not in h or h.endswith("."):
                  return False
              if re.fullmatch(r"[\d.]+", h):
                  try:
                      ip = ipaddress.ip_address(h)
                  except ValueError:
                      return False
                  return not (ip.is_private or ip.is_loopback or ip.is_unspecified or ip.is_reserved)
              return True


          def port_ok(p) -> bool:
              return isinstance(p, int) and 1 <= p <= 65535


          def extract_uris(text: str):
              seen, out = set(), []
              for m in URI_RE.finditer(text):
                  u = m.group(0).rstrip(TRAIL)
                  if u.lower().startswith("vmess://"):
                      u = u[:8] + re.match(r"[A-Za-z0-9+/=_\-]*", u[8:]).group(0)
                  if u not in seen:
                      seen.add(u)
                      out.append(u)
              return out


          def parse_vmess(uri: str) -> Optional[Config]:
              try:
                  j = json.loads(b64d(uri[8:]).decode("utf-8"))
                  host = str(j.get("add", "")).strip()
                  port = int(j.get("port"))
                  uid = str(j.get("id", "")).strip()
                  uuid.UUID(uid)
              except Exception:
                  return None
              if not (host_ok(host) and port_ok(port)):
                  return None
              extra = [str(j.get(k, "")) for k in ("net", "type", "host", "path", "tls", "sni")]
              return Config("vmess", host, port, sha("vmess", host.lower(), port, uid.lower(), *extra),
                            str(j.get("ps", "")), uri, j)


          def parse_urltype(uri: str, proto: str) -> Optional[Config]:
              try:
                  sp = urlsplit(uri)
                  user = unquote(sp.netloc.rpartition("@")[0])
                  host, port = sp.hostname, sp.port
              except ValueError:
                  return None
              if not user or not host_ok(host) or not port_ok(port):
                  return None
              if proto == "vless":
                  try:
                      uuid.UUID(user)
                  except ValueError:
                      return None
              q = sorted(parse_qsl(sp.query, keep_blank_values=True))
              return Config(proto, host, port, sha(proto, user, host.lower(), port, q), unquote(sp.fragment), uri)


          def parse_ss(uri: str) -> Optional[Config]:
              body, _, frag = uri[5:].partition("#")
              body, _, query = body.partition("?")
              try:
                  if "@" in body:
                      userinfo, _, hp = body.rpartition("@")
                      userinfo = unquote(userinfo)
                      cred = userinfo if ":" in userinfo else b64d(userinfo).decode("utf-8")
                  else:
                      dec = b64d(body).decode("utf-8")
                      cred, _, hp = dec.rpartition("@")
                  method, _, password = cred.partition(":")
                  host, _, port_s = hp.strip("/").rpartition(":")
                  host = host.strip("[]")
                  port = int(port_s)
              except Exception:
                  return None
              method = method.lower()
              if method not in SS_METHODS or not password or not host_ok(host) or not port_ok(port):
                  return None
              return Config("ss", host, port, sha("ss", method, password, host.lower(), port, query), unquote(frag), uri)


          def parse_config(uri: str) -> Optional[Config]:
              p = uri.split("://", 1)[0].lower()
              if p == "vmess":
                  return parse_vmess(uri)
              if p in ("vless", "trojan"):
                  return parse_urltype(uri, p)
              if p == "ss":
                  return parse_ss(uri)
              return None


          def clean_name(c: Config) -> str:
              n = AD_NAME_RE.sub(" ", c.name or "")
              n = re.sub(r"\s+", " ", n).strip(" |-_,;:·•")[:60]
              return n or f"{c.proto.upper()}-{c.host}"


          def render(c: Config, emoji: str) -> str:
              name = f"{clean_name(c)} {emoji}".strip()
              if c.proto == "vmess":
                  j = dict(c.vm or {})
                  j["ps"] = name
                  raw = json.dumps(j, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                  return "vmess://" + base64.b64encode(raw).decode()
              return c.uri.split("#", 1)[0] + "#" + quote(name, safe="")


          def tcp_alive(targets):
              def probe(t):
                  try:
                      with socket.create_connection(t, timeout=TCP_TIMEOUT):
                          return t, True
                  except OSError:
                      return t, False

              with ThreadPoolExecutor(max_workers=150) as ex:
                  return {t for t, ok in ex.map(probe, targets) if ok}


          # ───────────────────────────── فایل‌ها ─────────────────────────────
          def atomic_write(path: Path, text: str):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_name(path.name + ".tmp")
              tmp.write_text(text, encoding="utf-8")
              os.replace(tmp, path)


          def load_json(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None


          def load_channels():
              seen, out = set(), []
              for line in os.getenv("CHANNELS", "").splitlines():
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  s = re.sub(r"^(?:https?://)?(?:t\.me/(?:s/)?)?@?", "", s).strip("/").split("/")[0].split("?")[0]
                  if s and s.lower() not in seen:
                      seen.add(s.lower())
                      out.append(s)
              return out


          def previous_keys():
              try:
                  lines = (OUT / "sub_plain.txt").read_text(encoding="utf-8").splitlines()
              except Exception:
                  return set()
              return {c.key for c in (parse_config(u.strip()) for u in lines if u.strip()) if c}


          # ───────────────────────────── اجرای اصلی ─────────────────────────────
          def run(channels, fetcher=fetch_channel, now: Optional[datetime] = None, tcp_check: Optional[bool] = None) -> dict:
              now = now or datetime.now(timezone.utc)
              tcp_check = TCP_CHECK if tcp_check is None else tcp_check
              cutoff = now - timedelta(days=WINDOW_DAYS)

              def one(ch):
                  try:
                      return ch, fetcher(ch, cutoff), None
                  except Exception as e:
                      return ch, None, f"{type(e).__name__}: {e}"

              with ThreadPoolExecutor(max_workers=6) as ex:
                  results = list(ex.map(one, channels))

              stats = dict(extracted=0, invalid=0, duplicates=0, dead=0, over_limit_messages=0, sale_messages=0)
              per_channel, cands = {}, []
              for ch, msgs, err in results:
                  info = {"name": ch, "ok": err is None, "error": err or "", "messages": 0, "configs": 0, "emoji": ""}
                  per_channel[ch] = info
                  if err:
                      log(f"  ✗ {ch}: {err}")
                      continue
                  info["messages"] = len(msgs)
                  for m in msgs:
                      uris = extract_uris(m.text)
                      if not uris:
                          continue
                      if SALE_RE.search(m.text):
                          stats["sale_messages"] += 1
                          continue
                      if len(uris) > MAX_PER_MESSAGE:
                          stats["over_limit_messages"] += 1
                          continue
                      for u in uris:
                          stats["extracted"] += 1
                          c = parse_config(u)
                          if c is None:
                              stats["invalid"] += 1
                              continue
                          info["configs"] += 1
                          cands.append((m.date, ch, c))
                  info["emoji"] = HEAVY_EMOJI if info["configs"] >= HEAVY_THRESHOLD else LIGHT_EMOJI
                  log(f"  ✓ {ch}: {len(msgs)} msgs, {info['configs']} configs {info['emoji']}")

              cands.sort(key=lambda x: x[0])           # قدیمی‌ترین منبع، صاحب کانفیگ تکراری است
              uniq = {}
              for d, ch, c in cands:
                  if c.key in uniq:
                      stats["duplicates"] += 1
                  else:
                      uniq[c.key] = (d, ch, c)
              items = list(uniq.values())

              if tcp_check and items:
                  targets = {(c.host, c.port) for _, _, c in items}
                  alive = tcp_alive(targets)
                  if len(targets) >= 20 and len(alive) < 0.1 * len(targets):
                      log("  ! TCP check looks unreliable (almost nothing reachable) -> skipped")
                  else:
                      before = len(items)
                      items = [i for i in items if (i[2].host, i[2].port) in alive]
                      stats["dead"] = before - len(items)

              items.sort(key=lambda x: x[0], reverse=True)   # تازه‌ترین‌ها اول
              if MAX_TOTAL > 0:
                  items = items[:MAX_TOTAL]
              lines = [render(c, per_channel[ch]["emoji"]) for _, ch, c in items]

              ok_channels = sum(1 for i in per_channel.values() if i["ok"])
              prev_keys = previous_keys()
              new_keys = {c.key for _, _, c in items}
              new_count = len(new_keys - prev_keys)
              removed_prev = len(prev_keys - new_keys)
              invalid_total = stats["invalid"] + stats["dead"]

              if ok_channels == 0:
                  status, msg = "failed", "هیچ کانالی در دسترس نبود؛ نسخه قبلی اشتراک حفظ شد."
              elif not lines:
                  status, msg = "skipped", "کانفیگ معتبری پیدا نشد؛ اشتراک خالی منتشر نشد و نسخه قبلی حفظ شد."
              else:
                  status, msg = "success", "اشتراک با موفقیت بازسازی شد."
       
