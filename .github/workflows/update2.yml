name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          echo "📥 تعداد خطوط: $(wc -l < all.txt)"

      - name: Detect country codes (ignore errors)
        run: |
          # استخراج IPهای یکتا (اگه هیچی نبود، ادامه بده)
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt | sort -u > unique_ips.txt || true
          
          if [ ! -s unique_ips.txt ]; then
            echo "⚠️ هیچ IPی پیدا نشد، همه رو XX می‌ذاریم"
            touch country_map.txt
          else
            split -l 100 unique_ips.txt chunk_ || true
            > country_map.txt
            
            for chunk in chunk_*; do
              # ساخت JSON با مدیریت خطا
              json=$(jq -R . < "$chunk" | jq -s . 2>/dev/null || echo '[]')
              
              # درخواست با مدیریت خطا (اگه خطا داد، خروجی خالی)
              response=$(curl -s -X POST "http://ip-api.com/batch" \
                -H "Content-Type: application/json" \
                -d "$json" 2>/dev/null || echo '')
              
              # اگه پاسخ معتبر بود، پردازش کن؛ در غیر این صورت XX بذار
              if [ -n "$response" ] && echo "$response" | jq -e . >/dev/null 2>&1; then
                echo "$response" | jq -r '.[] | "\(.query)|\(.countryCode // "XX")"' >> country_map.txt
              else
                # برای همه IPهای این chunk، XX بذار
                cat "$chunk" | while read ip; do
                  echo "$ip|XX" >> country_map.txt
                done
              fi
              sleep 0.2
            done
            rm -f chunk_* || true
          fi
          
          # پردازش هر خط با مدیریت کامل خطا
          > final.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1 || true)
            country_code="XX"
            
            if [ -n "$ip" ]; then
              country_code=$(grep "^$ip|" country_map.txt | cut -d'|' -f2 | head -1 || echo "XX")
              [ -z "$country_code" ] && country_code="XX"
            fi
            
            # پردازش vmess
            if [[ "$line" == vmess://* ]]; then
              encoded=$(echo "$line" | sed 's/vmess:\/\///')
              decoded=$(echo "$encoded" | base64 -d 2>/dev/null || echo '')
              
              if [ -n "$decoded" ] && echo "$decoded" | jq -e . >/dev/null 2>&1; then
                new_decoded=$(echo "$decoded" | jq --arg country "$country_code" '.ps = $country' 2>/dev/null || echo "$decoded")
                new_encoded=$(echo "$new_decoded" | base64 -w 0 2>/dev/null || echo "$new_decoded" | base64)
                echo "vmess://$new_encoded" >> final.txt
              else
                echo "${line}#${country_code}" >> final.txt
              fi
            
            # vless و سایر
            else
              if [[ "$line" == *"#"* ]]; then
                echo "$line" | sed "s/#[^#]*$/#$country_code/" >> final.txt
              else
                echo "${line}#${country_code}" >> final.txt
              fi
            fi
            
          done < all.txt
          
          mv final.txt all.txt
          rm -f unique_ips.txt country_map.txt || true

      - name: Keep 200 random configs
        run: |
          shuf all.txt | head -n 200 > SUBTEXT2 || true
          echo "📄 تعداد نهایی: $(wc -l < SUBTEXT2)"

      - name: Show sample (debug)
        run: head -n 3 SUBTEXT2 || true

      - name: Commit and push (ignore errors)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2 || true
          
          if git diff --cached --quiet; then
            echo "✅ بدون تغییر، خروج موفق"
            exit 0
          fi
          
          git commit -m "Update SUBTEXT2 with countries" || true
          git push || true
