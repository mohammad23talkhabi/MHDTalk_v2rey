name: SUBTEXT2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download subscription
        run: |
          set +e  # غیرفعال کردن exit on error
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          # اگه دانلود نشد، فایل خالی بساز تا ادامه کار متوقف نشه
          if [ ! -s all.txt ]; then
            echo "⚠️ دانلود ناموفق، فایل خالی ایجاد شد"
            touch all.txt
          fi
          echo "📥 تعداد خطوط: $(wc -l < all.txt)"
          exit 0

      - name: Detect country codes (ignore all errors)
        run: |
          set +e
          
          # استخراج IPها (اگه خطا داد، فایل خالی بساز)
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt | sort -u > unique_ips.txt 2>/dev/null
          if [ ! -s unique_ips.txt ]; then
            echo "⚠️ هیچ IPی پیدا نشد"
            touch unique_ips.txt
          fi
          
          # ساخت نقشه کشورها
          > country_map.txt
          if [ -s unique_ips.txt ]; then
            split -l 100 unique_ips.txt chunk_ 2>/dev/null
            for chunk in chunk_*; do
              json=$(jq -R . < "$chunk" | jq -s . 2>/dev/null || echo '[]')
              response=$(curl -s -X POST "http://ip-api.com/batch" -H "Content-Type: application/json" -d "$json" 2>/dev/null || echo '')
              if [ -n "$response" ] && echo "$response" | jq -e . >/dev/null 2>&1; then
                echo "$response" | jq -r '.[] | "\(.query)|\(.countryCode // "XX")"' >> country_map.txt 2>/dev/null
              else
                cat "$chunk" | while read ip; do echo "$ip|XX"; done >> country_map.txt
              fi
              sleep 0.2
            done
            rm -f chunk_* 2>/dev/null
          fi
          
          # پردازش هر خط
          > final.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1 2>/dev/null)
            country_code="XX"
            if [ -n "$ip" ]; then
              country_code=$(grep "^$ip|" country_map.txt | cut -d'|' -f2 | head -1 2>/dev/null || echo "XX")
              [ -z "$country_code" ] && country_code="XX"
            fi
            
            # پردازش vmess
            if [[ "$line" == vmess://* ]]; then
              encoded=$(echo "$line" | sed 's/vmess:\/\///')
              decoded=$(echo "$encoded" | base64 -d 2>/dev/null || echo '')
              if [ -n "$decoded" ] && echo "$decoded" | jq -e . >/dev/null 2>&1; then
                new_decoded=$(echo "$decoded" | jq --arg country "$country_code" '.ps = $country' 2>/dev/null || echo "$decoded")
                new_encoded=$(echo "$new_decoded" | base64 -w 0 2>/dev/null || echo "$new_decoded" | base64)
                echo "vmess://$new_encoded" >> final.txt
              else
                echo "${line}#${country_code}" >> final.txt
              fi
            else
              # vless و سایر
              if [[ "$line" == *"#"* ]]; then
                echo "$line" | sed "s/#[^#]*$/#$country_code/" >> final.txt
              else
                echo "${line}#${country_code}" >> final.txt
              fi
            fi
          done < all.txt
          
          mv final.txt all.txt 2>/dev/null
          rm -f unique_ips.txt country_map.txt 2>/dev/null
          exit 0

      - name: Keep 200 random configs
        run: |
          set +e
          shuf all.txt | head -n 200 > SUBTEXT2 2>/dev/null
          # اگه فایل خالی شد، حداقل یه چیزی توش بذار
          if [ ! -s SUBTEXT2 ]; then
            echo "# No configs available" > SUBTEXT2
          fi
          echo "📄 تعداد نهایی: $(wc -l < SUBTEXT2)"
          exit 0

      - name: Show sample (debug)
        run: |
          set +e
          head -n 3 SUBTEXT2 2>/dev/null || echo "نمونه‌ای وجود ندارد"
          exit 0

      - name: Commit and push (never fail)
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SUBTEXT2 2>/dev/null
          
          if git diff --cached --quiet 2>/dev/null; then
            echo "✅ بدون تغییر، خروج موفق"
            exit 0
          fi
          
          git commit -m "Update SUBTEXT2 with countries" 2>/dev/null
          git push 2>/dev/null
          
          # همیشه موفق تموم میشه، حتی اگه push خطا بده
          echo "✅ مراحل با موفقیت (یا خطای نادیده گرفته شده) به پایان رسید"
          exit 0
